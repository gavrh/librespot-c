[package]
name = "librespot"
version = "0.1.0"
edition = "2021"

[lib]
name = "respot_core"
path = "./lib.rs"
crate-type = ["cdylib"]

[features]
default = ["backend-rodio"]

backend-rodio = ["librespot/rodio-backend"]
backend-alsa = ["librespot/alsa-backend"]
backend-pulseaudio = ["librespot/pulseaudio-backend"]
backend-jack = ["librespot/jackaudio-backend"]
backend-portaudio = ["librespot/portaudio-backend"]
backend-sdl = ["librespot/sdl-backend"]
backend-gstreamer = ["librespot/gstreamer-backend"]
backend-rodiojack = ["librespot/rodiojack-backend"]

[dependencies]
libc = "0.2.170"
librespot = { git = "https://github.com/librespot-org/librespot", branch = "dev", default-features = false, features = ["native-tls", "with-libmdns"] }
tokio = { version = "1.43.0", features = ["full"] }
tokio-stream = { version = "0.1.17", features = ["full"] }
url = "2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["fileapi", "handleapi", "processenv", "winbase", "winnt"] }
